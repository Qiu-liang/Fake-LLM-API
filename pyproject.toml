[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-llm"
version = "0.1.0"
description = "真人假 LLM 服务：以 OpenAI / Anthropic 双协议对外提供接口，由人类操作员统一作答"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "anyio>=4",
]

[project.scripts]
fake-llm = "fake_llm.__main__:main"

[tool.setuptools.packages.find]
include = ["fake_llm*"]

[tool.setuptools.package-data]
fake_llm = ["py.typed", "operator/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
