<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>能工智人操作台</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #090d18;
    color: #e8edf7;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    --surface: rgba(17, 24, 39, .88);
    --surface-raised: #151d2e;
    --border: rgba(148, 163, 184, .15);
    --muted: #8793a8;
    --accent: #8b9cff;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    padding: 48px 24px 28px;
    background:
      radial-gradient(ellipse at 50% -18%, rgba(79, 99, 210, .25), transparent 52%),
      radial-gradient(ellipse at 100% 75%, rgba(53, 93, 155, .1), transparent 40%),
      #090d18;
  }
  .app { width: min(100%, 920px); margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .brand-mark {
    display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center;
    border: 1px solid rgba(176, 188, 255, .3); border-radius: 14px;
    background: linear-gradient(145deg, #6678f5, #3948a8);
    box-shadow: 0 8px 24px rgba(63, 79, 194, .28);
    color: white; font-size: 17px; font-weight: 750; letter-spacing: -.06em;
  }
  .brand-copy { min-width: 0; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.025em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  #status {
    display: inline-flex; align-items: center; gap: 9px; flex: 0 0 auto;
    padding: 9px 13px; border: 1px solid var(--border); border-radius: 999px;
    background: rgba(17, 24, 39, .7); color: #c3ccdc; font-size: 12px;
  }
  #status::before { width: 7px; height: 7px; border-radius: 50%; background: #6ed6a1; content: ""; box-shadow: 0 0 10px rgba(110, 214, 161, .48); }
  .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 0 2px 12px; }
  .eyebrow { margin: 0 0 6px; color: #99a6bd; font-size: 10px; font-weight: 700; letter-spacing: .16em; }
  .section-heading h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .hint { color: var(--muted); font-size: 12px; }
  .request-card, .composer, .tips {
    border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .18); backdrop-filter: blur(14px);
  }
  #q {
    min-height: 260px; max-height: min(54vh, 560px); overflow: auto; margin: 0;
    padding: 22px 24px; border-radius: 16px; color: #dbe3f0;
    font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #q:empty { display: grid; place-items: center; }
  #q .model { margin-bottom: 17px; color: #a6b2ca; font-size: 12px; font-weight: 550; }
  #q .context { margin: 8px 0 18px; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: rgba(9, 13, 24, .45); }
  #q .context summary { padding: 10px 13px; color: #aab6ca; cursor: pointer; font-size: 12px; transition: color .15s ease, background .15s ease; }
  #q .context summary:hover { color: #e2e8f2; background: rgba(148, 163, 184, .06); }
  #q .context-content { max-height: 38vh; overflow: auto; padding: 0 14px 13px; border-top: 1px solid var(--border); }
  #q .latest-label { margin: 17px 0 5px; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
  #q .role { margin: 8px 0 4px; color: #8da0c2; font-size: 11px; font-weight: 650; letter-spacing: .04em; }
  #q .message-content { padding-left: 11px; border-left: 2px solid rgba(139, 156, 255, .25); }
  #q img { display: block; max-width: min(100%, 420px); max-height: 320px; margin: 10px 0;
           border: 1px solid var(--border); border-radius: 10px; object-fit: contain; }
  .composer { margin-top: 18px; padding: 17px; }
  .composer-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 10px; color: #d8e0ed; font-size: 12px; font-weight: 600; }
  .composer-label span:last-child { color: var(--muted); font-size: 11px; font-weight: 400; }
  textarea {
    display: block; width: 100%; min-height: 112px; resize: vertical; padding: 13px 14px;
    border: 1px solid rgba(148, 163, 184, .18); border-radius: 10px; outline: none;
    background: rgba(7, 11, 20, .72); color: #eef2fa; font: inherit; font-size: 14px; line-height: 1.6;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea::placeholder { color: #69768c; }
  textarea:focus { border-color: rgba(139, 156, 255, .75); box-shadow: 0 0 0 3px rgba(99, 116, 226, .14); }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .actions-note { color: var(--muted); font-size: 11px; }
  .button-group { display: flex; gap: 9px; }
  button {
    display: inline-flex; min-height: 39px; align-items: center; justify-content: center; gap: 8px;
    padding: 0 15px; border: 1px solid transparent; border-radius: 9px; cursor: pointer;
    color: white; font: inherit; font-size: 12px; font-weight: 600;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible, #q summary:focus-visible { outline: 2px solid #aab5ff; outline-offset: 3px; }
  button.primary { background: linear-gradient(135deg, #697cf1, #5364d2); box-shadow: 0 5px 15px rgba(79, 96, 210, .22); }
  button.primary:hover { background: linear-gradient(135deg, #7889fa, #6071e1); }
  button.secondary { border-color: var(--border); background: rgba(148, 163, 184, .07); color: #bac4d4; }
  button.secondary:hover { border-color: rgba(148, 163, 184, .3); background: rgba(148, 163, 184, .12); color: #e4eaf4; }
  .tips { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 13px; padding: 13px 16px; box-shadow: none; color: #8996ab; font-size: 11px; line-height: 1.7; }
  .tips strong { color: #aab7cd; font-weight: 550; }
  code, kbd { padding: 2px 5px; border: 1px solid rgba(148, 163, 184, .15); border-radius: 5px; background: rgba(148, 163, 184, .08); color: #c2cafa; font: inherit; font-size: 10px; }
  kbd { color: #d5dceb; }
  @media (max-width: 600px) {
    body { padding: 26px 14px 20px; }
    .topbar { align-items: flex-start; margin-bottom: 23px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; }
    .brand h1 { font-size: 15px; }
    .brand p { max-width: 180px; font-size: 11px; }
    #status { padding: 8px 10px; font-size: 11px; }
    .section-heading { align-items: start; flex-direction: column; gap: 5px; }
    #q { min-height: 220px; max-height: 50vh; padding: 17px; }
    .composer { padding: 13px; }
    .actions { align-items: flex-start; flex-direction: column; }
    .button-group { width: 100%; }
    .button-group button { flex: 1; }
    .tips { gap: 6px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">AS</div>
      <div class="brand-copy">
        <h1>Artisan Sapiens</h1>
        <p>Human-in-the-loop · 操作控制台</p>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite">排队中: 0</div>
  </header>

  <section aria-labelledby="request-title">
    <div class="section-heading">
      <div>
        <p class="eyebrow">INCOMING REQUEST</p>
        <h2 id="request-title">当前请求</h2>
      </div>
      <span class="hint">检查上下文，并为 Agent 提交回复</span>
    </div>
    <div id="q" class="request-card">（等待请求…）</div>
  </section>

  <section class="composer" aria-label="回复输入区">
    <label class="composer-label" for="a">
      <span>你的回复</span>
      <span>支持普通文本或工具调用</span>
    </label>
    <textarea id="a" placeholder="输入给 Agent 的回复…"></textarea>
    <div class="actions">
      <span class="actions-note">按 <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 快速发送</span>
      <div class="button-group">
        <button class="secondary" type="button" onclick="skip()"><span aria-hidden="true">↷</span> 跳过请求</button>
        <button class="primary" type="button" onclick="submit()"><span aria-hidden="true">↑</span> 发送回复</button>
      </div>
    </div>
  </section>

  <aside class="tips" aria-label="操作提示">
    <span><strong>普通回答</strong> 输入文字后发送</span>
    <span><strong>工具调用</strong> <code>!tool get_weather {"city": "北京"}</code></span>
    <span><strong>图片</strong> 消息中的图片会显示在请求区</span>
  </aside>
</main>
<script>
let cur = null;
const qEl = document.getElementById("q");
const aEl = document.getElementById("a");
const statusEl = document.getElementById("status");

function isRenderableImage(url) {
  return typeof url === "string" && /^(https?:\/\/|data:image\/)/i.test(url);
}

function render(d) {
  qEl.innerHTML = "";
  const model = document.createElement("div");
  model.className = "model";
  model.textContent = "【伪装模型: " + d.model + "】";
  qEl.appendChild(model);

  const messages = d.messages || [];
  const context = messages.slice(0, -1);
  const latest = messages[messages.length - 1];
  if (context.length) {
    const details = document.createElement("details");
    details.className = "context";
    const summary = document.createElement("summary");
    summary.textContent = "此前上下文 · " + context.length + " 条消息（点击展开）";
    details.appendChild(summary);
    const content = document.createElement("div");
    content.className = "context-content";
    for (const m of context) content.appendChild(renderMessage(m));
    details.appendChild(content);
    qEl.appendChild(details);
  }

  if (latest) {
    const label = document.createElement("div");
    label.className = "latest-label";
    label.textContent = "最新消息";
    qEl.appendChild(label);
    qEl.appendChild(renderMessage(latest));
  }
}

function renderMessage(m) {
  const message = document.createElement("div");
  message.className = "message";
  const role = document.createElement("div");
  role.className = "role";
  role.textContent = "[" + m.role + "]";
  message.appendChild(role);
  const content = document.createElement("div");
  content.className = "message-content";
  for (const p of m.parts || []) {
    if (p.type === "image" && isRenderableImage(p.url)) {
      const img = document.createElement("img");
      img.src = p.url;
      if (p.media_type) img.alt = p.media_type;
      content.appendChild(img);
    } else {
      const div = document.createElement("div");
      div.textContent = p.type === "image" ? "[不支持的图片地址]" : p.text;
      content.appendChild(div);
    }
  }
  message.appendChild(content);
  return message;
}

async function poll() {
  const d = await (await fetch("/operator/next")).json();
  statusEl.textContent = "排队中: " + (d.queued ?? 0);
  if (d.request_id && cur !== d.request_id) {
    cur = d.request_id;
    render(d);
  }
}

async function submit() {
  if (!cur) return;
  const res = await fetch("/operator/answer", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({request_id: cur, answer: aEl.value}),
  });
  if (!res.ok) {
    alert((await res.json()).error);
    return;
  }
  aEl.value = "";
  cur = null;
  qEl.textContent = "（已发送，等待下一个请求…）";
  poll();
}

async function skip() {
  if (!cur) return;
  await fetch("/operator/skip", {method: "POST"});
  cur = null;
  qEl.textContent = "（已跳过）";
  poll();
}

aEl.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") submit();
});

setInterval(poll, __POLL_MS__);
poll();
</script>
</body>
</html>
