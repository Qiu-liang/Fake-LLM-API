<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>假LLM操作台</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 20px; }
  h3 { margin-bottom: 4px; }
  #status { color: #888; font-size: 13px; margin-bottom: 12px; }
  #q { white-space: pre-wrap; background: #1b1b2f; padding: 14px; border-radius: 8px;
       min-height: 100px; margin: 10px 0; font-size: 14px; }
  #q .model { color: #9ab; margin-bottom: 8px; }
  #q .role { margin-top: 10px; color: #8ab; }
  #q img { max-width: 320px; max-height: 240px; display: block; margin: 6px 0;
           border-radius: 6px; border: 1px solid #333; }
  textarea { width: 100%; height: 110px; background: #222; color: #eee;
             border: 1px solid #444; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
  button { margin: 8px 8px 0 0; padding: 8px 24px; background: #2d5bff; color: #fff;
           border: none; border-radius: 6px; cursor: pointer; }
  button.secondary { background: #444; }
  #tip { color: #888; font-size: 13px; line-height: 1.7; }
  code { background: #2a2a2a; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h3>🎭 Artisan Sapiens</h3>
<div id="status">排队中: 0</div>
<div id="q">（等待请求…）</div>
<textarea id="a" placeholder="输入回答；Ctrl+Enter 发送"></textarea>
<button onclick="submit()">发送</button>
<button class="secondary" onclick="skip()">跳过该请求</button>
<p id="tip">
  💡 普通文字 = 普通回答；调用工具请写：<code>!tool get_weather {"city": "北京"}</code><br>
  💡 消息中的图片会直接显示在上方；操作员回答暂只支持纯文本 / 工具调用<br>
  💡 伪装提示：像模型一样分点作答、别说口头语、别用emoji泛滥
</p>
<script>
let cur = null;
const qEl = document.getElementById("q");
const aEl = document.getElementById("a");
const statusEl = document.getElementById("status");

function isRenderableImage(url) {
  return typeof url === "string" && /^(https?:\/\/|data:image\/)/i.test(url);
}

function render(d) {
  qEl.innerHTML = "";
  const model = document.createElement("div");
  model.className = "model";
  model.textContent = "【伪装模型: " + d.model + "】";
  qEl.appendChild(model);
  for (const m of d.messages) {
    const role = document.createElement("div");
    role.className = "role";
    role.textContent = "[" + m.role + "]";
    qEl.appendChild(role);
    for (const p of m.parts || []) {
      if (p.type === "image" && isRenderableImage(p.url)) {
        const img = document.createElement("img");
        img.src = p.url;
        if (p.media_type) img.alt = p.media_type;
        qEl.appendChild(img);
      } else {
        const div = document.createElement("div");
        div.textContent = p.type === "image" ? "[不支持的图片地址]" : p.text;
        qEl.appendChild(div);
      }
    }
  }
}

async function poll() {
  const d = await (await fetch("/operator/next")).json();
  statusEl.textContent = "排队中: " + (d.queued ?? 0);
  if (d.request_id && cur !== d.request_id) {
    cur = d.request_id;
    render(d);
  }
}

async function submit() {
  if (!cur) return;
  const res = await fetch("/operator/answer", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({request_id: cur, answer: aEl.value}),
  });
  if (!res.ok) {
    alert((await res.json()).error);
    return;
  }
  aEl.value = "";
  cur = null;
  qEl.textContent = "（已发送，等待下一个请求…）";
  poll();
}

async function skip() {
  if (!cur) return;
  await fetch("/operator/skip", {method: "POST"});
  cur = null;
  qEl.textContent = "（已跳过）";
  poll();
}

aEl.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") submit();
});

setInterval(poll, __POLL_MS__);
poll();
</script>
</body>
</html>
